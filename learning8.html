<!DOCTYPE html>
<html lang="en" >
    <head>
<meta charset="utf-8" >
<meta name="viewport" content="width=device-width, initial-scale=1.0" >
<title>Form</title>
<link rel="icon" href="learn.jpg" >
    </head>
<body>
<Form action="/Submit" method="post">
<div>
   <label>Name:</label>
   <input type="text" name="username" value="gowthami" pattern="[a-zA-Z\s]+" title="Only letters and spaces are allowed" required >
</div>
<br>
<div>
   <label>Email:</label>
   <input type="email" name="email" required >
</div>
<br>
<div>
   <label>Password:</label>
   <input type="password" name="password" required >
</div>
<br>
<div>
   <label>Contact Number:</label>
   <input type="number" name="contact number" required >
</div>
<br>
<div>
   <label>Date:</label>
   <input type="date" name="date" required >
</div>
<br>
<div>
   <label>Gender:</label>
   <input type="radio" name="gender" value="male" required >Male
   <input type="radio" name="gender" value="female"  >Female
   <input type="radio" name="gender" value="other" >Other
</div>
<br>
<div>
   <label>Subject:</label>
   <input type="checkbox" name="Subject" value="Tamil" >Tamil
   <input type="checkbox" name="Subject" value="English"  >English
   <input type="checkbox" name="Subject" value="Maths"  >Maths
   <input type="checkbox" name="Subject" value="Science"  >Science
 </div>
 <br>
 <div>
   <label>Department:</label>
   <select name="Department" required>
      <option value="">--Select department option--</option>
      <option value="IT">IT</option>
      <option value="CSE">CSE</option>
      <option value="ECE">ECE</option>
</select>
</div>
<br>

<div>
   <textarea name="Feedback" placeholder="Enter your feedback here..." required></textarea>
   <button type="submit">Submit</button>
</div>


</Form>
</body>
</html>
