<!DOCTYPE >
<html lang="en" >

<head>
   <meta charset="utf-8" >
   <meta name="viewport" content="width=device-width, initial-scale=1.0" >  
   <title>Form</title>

</head>
<body>
<form>
<div>    
   <lable>Name:</lable>
   <input type="text" name="username" required >
</div> 
<br>
<div>
    <label>Email:</label>
    <input type="email" name="email" required >
<div>
<br>
<div>
    <label>Password:</label>
    <input type="password" name="password" required >
</div>
<br>
<div>
    <label>Contact number:</label>
    <input type="tel" name="contact number" required >
<div>
<br>
<div>
    <label>Date:</label>
    <input type="date" name="date" required >
</div>
<br>
<div>
    <label>Gender:</label>
    <input type="radio" name="gender" value="male" required >Male
    <input type="radio" name="gender" value="female" required >Female
    <input type="radio" name="gender" value="other" required >Other
</div>
<br>
<div>
    <label>Department:</label>
    <select name="Department" required >
    <option value="">select department</option>
    <option value="IT">IT</option>
    <option value="CSE" >CSE</option> 
    <option value="ECE" >ECE</option>
</div>
<br>
<div>
    <label>Subject:</label>
    <input type="checkbox" name="subject" value="Tamil" >Tamil
    <input type="checkbox" name="subject" value="English" >English
    <input type="checkbox" name="subject" value="Maths" >Maths
</div>
<br>
<div>
    <table border="1">
<tr>
    <th>Student name</th>
    <th>Class</th>
    <th>Marks</th>
</tr>
<tr>
    <td>Gowthami</td>
    <td>IT</td>
    <td>85</td>
</tr>
<tr>
   <td>Sajan</td>
   <td>IT</td>
   <td>90</td>
</tr>
<tr>
   <td>Dhakshitha</td>
   <td>CSE</td>
   <td>80</td>
</tr>
</table>
</div>
<br>
<div>
    <label>Feedback:</label>
    <textarea name="Feedback" placeholder="Enter your feedback here..." required ></textarea>
</div>
<br>
<button type="submit" >Submit</button>

</form>

</body>

</html>
